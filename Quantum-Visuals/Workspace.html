<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace | Quantum Control</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-dark: #050505; /* Darker for better contrast */
            --bg-panel: rgba(21, 25, 34, 0.7); /* Semi-transparent */
            --bg-hover: rgba(30, 38, 48, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #f59e0b;
            --accent-dim: #92400e;
            --text-main: #e2e8f0;
            --text-muted: #718096;
            --tag-bg: rgba(59, 130, 246, 0.15);
            --tag-text: #60a5fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- 3D Background Container --- */
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            /* CRITICAL: Vignette to darken the center for readability */
            background: radial-gradient(circle at center, rgba(5,5,5,0.6) 0%, rgba(5,5,5,0.95) 80%);
        }

        /* --- Sidebar --- */
        aside {
            width: 260px;
            background: rgba(11, 14, 20, 0.85); /* Glass effect */
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            flex-shrink: 0;
            z-index: 10;
        }

        .brand {
            padding: 0 24px 24px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }

        .nav-section { padding: 0 12px; margin-bottom: 24px; }
        .nav-label {
            font-size: 11px; text-transform: uppercase; color: var(--text-muted);
            padding-left: 12px; margin-bottom: 8px; font-weight: 600;
        }
        .nav-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 12px;
            border-radius: 6px; color: var(--text-muted); text-decoration: none;
            cursor: pointer; transition: all 0.2s; font-size: 14px;
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
        .nav-item.active {
            background: rgba(245, 158, 11, 0.1); color: var(--accent); font-weight: 500;
            border-left: 3px solid var(--accent);
        }
        .nav-item i { font-size: 18px; }

        /* --- Main Content --- */
        main {
            flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; z-index: 5;
        }

        header {
            height: 70px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px; background: rgba(11, 14, 20, 0.6); backdrop-filter: blur(10px);
        }

        .breadcrumbs { font-size: 14px; color: var(--text-muted); }
        .breadcrumbs span { color: var(--text-main); font-weight: 500; }

        .header-actions { display: flex; gap: 12px; }

        .btn {
            padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 8px; border: 1px solid transparent; transition: all 0.2s;
        }
        .btn-secondary { background: rgba(255,255,255,0.05); border-color: var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: var(--text-muted); }
        .btn-primary { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        .btn-primary:hover { filter: brightness(1.1); }

        .content-scroll { flex: 1; overflow-y: auto; padding: 32px; }

        .workspace-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
        .workspace-title { font-size: 24px; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .workspace-count { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

        /* --- Cards with Glass --- */
        .card {
            background: rgba(21, 25, 34, 0.6); /* More transparency */
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 8px; padding: 20px;
            display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s, background 0.2s;
            position: relative; cursor: pointer;
        }
        .card:hover {
            transform: translateY(-2px); border-color: var(--accent);
            background: rgba(21, 25, 34, 0.8);
        }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-id {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted);
            background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border);
        }
        .card-menu-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 4px; }
        .card-menu-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
        .card-title { font-size: 16px; font-weight: 500; margin-bottom: 6px; color: var(--text-main); }
        .card-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
        .card-tags { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .tag-status { background: rgba(255,255,255,0.1); color: var(--text-muted); border: 1px solid var(--border); }
        .tag-status.published { background: rgba(16, 185, 129, 0.2); color: #34d399; border-color: transparent; }
        .tag-duplicate { background: var(--tag-bg); color: var(--tag-text); border: 1px solid transparent; }

        /* --- Context Menu --- */
        .context-menu {
            position: absolute; background: rgba(21, 25, 34, 0.95); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 6px; width: 180px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 100; display: none; flex-direction: column; padding: 4px;
        }
        .context-menu.visible { display: flex; }
        .menu-item { padding: 8px 12px; font-size: 13px; color: var(--text-main); cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 8px; }
        .menu-item:hover { background: rgba(255,255,255,0.1); }
        .menu-item.danger { color: #f87171; }
        .menu-item.danger:hover { background: rgba(248, 113, 113, 0.1); }

        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: rgba(21, 25, 34, 0.95); border: 1px solid var(--accent);
            padding: 12px 20px; border-radius: 6px; color: var(--text-main); font-size: 13px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 200;
            display: flex; align-items: center; gap: 10px; backdrop-filter: blur(5px);
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast i { color: var(--accent); font-size: 18px; }
    </style>
</head>
<body>

    <!-- 3D Background -->
    <div id="canvas-container"></div>

    <aside>
        <div class="brand">
            <i class="ph ph-hexagon"></i> QUANTUM
        </div>
        <div class="nav-section">
            <div class="nav-label">Main</div>
            <a href="index.html" class="nav-item"><i class="ph ph-house"></i> Landing</a>
            <a href="#" class="nav-item active"><i class="ph ph-squares-four"></i> Workspace</a>
            <a href="team.html" class="nav-item"><i class="ph ph-users"></i> Team</a>
        </div>
        <div class="nav-section">
            <div class="nav-label">Your Workspaces</div>
            <div id="workspace-list"></div>
        </div>
    </aside>

    <main>
        <header>
            <div class="breadcrumbs">Workspaces / <span id="breadcrumb-active">Personal</span></div>
            <div class="header-actions">
                <button class="btn btn-secondary"><i class="ph ph-funnel"></i> Filter</button>
                <button class="btn btn-primary"><i class="ph ph-plus"></i> New Mission</button>
            </div>
        </header>
        <div class="content-scroll">
            <div class="workspace-header">
                <div>
                    <h1 class="workspace-title" id="ws-title">Personal Workspace</h1>
                    <div class="workspace-count"><span id="ws-count">0</span> missions</div>
                </div>
            </div>
            <div class="grid" id="mission-grid"></div>
        </div>
    </main>

    <div class="context-menu" id="context-menu">
        <div class="menu-item" onclick="actions.open()"><i class="ph ph-arrow-square-out"></i> Open Simulator</div>
        <div class="menu-item" onclick="actions.share()"><i class="ph ph-share-network"></i> Share to Team</div>
        <div class="menu-item" onclick="actions.duplicate()"><i class="ph ph-copy"></i> Duplicate</div>
        <div style="height:1px; background:var(--border); margin:4px 0;"></div>
        <div class="menu-item danger" onclick="actions.delete()"><i class="ph ph-trash"></i> Delete</div>
    </div>

    <div class="toast" id="toast"><i class="ph ph-check-circle"></i><span id="toast-msg">Action successful</span></div>

    <script type="module">
        import * as THREE from 'three';

        // --- 3D Background: Digital Terrain (Subtle Points Wave) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.002); // Very subtle fog

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);
        camera.lookAt(0,0,0);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Create a plane of points
        const geometry = new THREE.PlaneGeometry(60, 60, 40, 40);
        const count = geometry.attributes.position.count;
        
        // Add random height variation
        for (let i = 0; i < count; i++) {
            const x = geometry.attributes.position.getX(i);
            const y = geometry.attributes.position.getY(i);
            geometry.attributes.position.setZ(i, Math.random() * 1);
        }

        const material = new THREE.PointsMaterial({
            color: 0xf59e0b, // Amber
            size: 0.05,
            transparent: true,
            opacity: 0.3 // Very dim
        });

        const terrain = new THREE.Points(geometry, material);
        terrain.rotation.x = -Math.PI / 2; // Lay flat
        scene.add(terrain);

        // Interaction
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.001;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.001;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // Animate points to create a wave
            const positions = terrain.geometry.attributes.position;
            for (let i = 0; i < count; i++) {
                const x = positions.getX(i);
                const y = positions.getY(i);
                // Sine wave based on position and time
                positions.setZ(i, Math.sin(x/2 + t) * 0.5 + Math.cos(y/2 + t) * 0.5);
            }
            positions.needsUpdate = true;

            // Slight camera parallax
            camera.position.x += (mouseX * 5 - camera.position.x) * 0.02;
            camera.position.y += (-mouseY * 5 + 5 - camera.position.y) * 0.02;
            camera.lookAt(0,0,0);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

    <script>
        // --- Original App Logic (Unchanged) ---
        const workspaces = [
            { id: 'personal', name: 'Personal Workspace', icon: 'ph-user', count: 5 },
            { id: 'team-alpha', name: 'Team Alpha', icon: 'ph-users-three', count: 12 },
            { id: 'engineering', name: 'Engineering Dept', icon: 'ph-gear', count: 8 },
            { id: 'public', name: 'Public Library', icon: 'ph-globe', count: 25 }
        ];

        let missions = [
            { id: 'QS-1024', title: 'Basic Flight Test', workspaceId: 'personal', status: 'published', lastMod: '2h ago', duplicatedFrom: null },
            { id: 'QS-1025', title: 'Obstacle Course A', workspaceId: 'personal', status: 'draft', lastMod: '1d ago', duplicatedFrom: 'Public Library' },
            { id: 'QS-1026', title: 'Precision Landing', workspaceId: 'personal', status: 'published', lastMod: '3d ago', duplicatedFrom: 'Team Alpha' },
            { id: 'QS-1027', title: 'Night Navigation', workspaceId: 'team-alpha', status: 'draft', lastMod: '5h ago', duplicatedFrom: null },
            { id: 'QS-1028', title: 'Swarm Coordination', workspaceId: 'team-alpha', status: 'published', lastMod: '1w ago', duplicatedFrom: 'Engineering Dept' },
            { id: 'QS-1029', title: 'CoDrone EDU Standard', workspaceId: 'public', status: 'published', lastMod: '1y ago', duplicatedFrom: null },
            { id: 'QS-1030', title: 'Advanced Wind Tunnel', workspaceId: 'public', status: 'published', lastMod: '6m ago', duplicatedFrom: null }
        ];

        let currentWorkspaceId = 'personal';
        let contextMenuTargetId = null;
        const gridEl = document.getElementById('mission-grid');
        const wsListEl = document.getElementById('workspace-list');
        const contextMenu = document.getElementById('context-menu');
        const toastEl = document.getElementById('toast');

        function init() {
            renderSidebar();
            loadWorkspace('personal');
            document.addEventListener('click', (e) => {
                if(!e.target.closest('.card-menu-btn') && !e.target.closest('.context-menu')) contextMenu.classList.remove('visible');
            });
        }

        function renderSidebar() {
            wsListEl.innerHTML = '';
            workspaces.forEach(ws => {
                const isActive = ws.id === currentWorkspaceId;
                const item = document.createElement('div');
                item.className = `nav-item ${isActive ? 'active' : ''}`;
                item.innerHTML = `<i class="ph ${ws.icon}"></i> ${ws.name}`;
                item.onclick = () => loadWorkspace(ws.id);
                wsListEl.appendChild(item);
            });
        }

        function loadWorkspace(id) {
            currentWorkspaceId = id;
            renderSidebar();
            const wsName = workspaces.find(w => w.id === id).name;
            document.getElementById('breadcrumb-active').innerText = wsName;
            document.getElementById('ws-title').innerText = wsName;
            const filtered = missions.filter(m => m.workspaceId === id);
            document.getElementById('ws-count').innerText = filtered.length;
            gridEl.innerHTML = '';
            if(filtered.length === 0) { gridEl.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:var(--text-muted); padding:40px;">No missions found.</div>`; return; }
            filtered.forEach(m => gridEl.appendChild(createCard(m)));
        }

        function createCard(mission) {
            const el = document.createElement('div');
            el.className = 'card';
            el.onclick = (e) => { if(!e.target.closest('.card-menu-btn')) actions.open(mission.id); };
            let duplicateTag = mission.duplicatedFrom ? `<span class="tag tag-duplicate"><i class="ph ph-copy"></i> Copied from ${mission.duplicatedFrom}</span>` : '';
            el.innerHTML = `
                <div class="card-header"><span class="card-id">${mission.id}</span><button class="card-menu-btn" onclick="toggleMenu(event, '${mission.id}')"><i class="ph ph-dots-three-vertical"></i></button></div>
                <div class="card-title">${mission.title}</div>
                <div class="card-meta"><i class="ph ph-clock"></i> Modified ${mission.lastMod}</div>
                <div class="card-tags"><span class="tag tag-status ${mission.status}">${mission.status.toUpperCase()}</span>${duplicateTag}</div>
            `;
            return el;
        }

        function toggleMenu(e, id) {
            e.stopPropagation(); contextMenuTargetId = id;
            const rect = e.target.getBoundingClientRect();
            contextMenu.style.top = (rect.bottom + 5) + 'px'; contextMenu.style.left = (rect.left - 150) + 'px'; contextMenu.classList.add('visible');
        }
        const actions = {
            open: (id = contextMenuTargetId) => { contextMenu.classList.remove('visible'); showToast(`Opening ${id}...`); },
            share: () => { contextMenu.classList.remove('visible'); showToast('Shared to Team.'); },
            duplicate: () => {
                contextMenu.classList.remove('visible');
                const original = missions.find(m => m.id === contextMenuTargetId); if(!original) return;
                const newId = 'QS-' + (Math.floor(Math.random() * 9000) + 1000);
                const newMission = { ...original, id: newId, title: original.title + ' (Copy)', workspaceId: 'personal', duplicatedFrom: workspaces.find(w => w.id === original.workspaceId).name, lastMod: 'Just now' };
                missions.unshift(newMission); if(currentWorkspaceId === 'personal') loadWorkspace('personal'); showToast('Duplicated to Personal.');
            },
            delete: () => { contextMenu.classList.remove('visible'); missions = missions.filter(m => m.id !== contextMenuTargetId); loadWorkspace(currentWorkspaceId); showToast('Deleted.'); }
        };
        function showToast(msg) { const t = document.getElementById('toast-msg'); t.innerText = msg; toastEl.classList.add('show'); setTimeout(() => toastEl.classList.remove('show'), 3000); }
        init();
    </script>
</body>
</html>
