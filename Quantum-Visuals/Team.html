<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Workspace | Quantum Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-dark: #050505;
            --bg-panel: rgba(21, 25, 34, 0.75);
            --bg-hover: rgba(30, 38, 48, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #f59e0b;
            --text-main: #e2e8f0;
            --text-muted: #718096;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif;
            height: 100vh; display: flex; overflow: hidden;
        }

        /* --- 3D Background Container --- */
        #canvas-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            /* Darker vignette for high text contrast */
            background: radial-gradient(circle at center, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.95) 85%);
        }

        /* --- Sidebar --- */
        aside {
            width: 260px; background: rgba(11, 14, 20, 0.9); backdrop-filter: blur(12px);
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
            padding: 20px 0; flex-shrink: 0; z-index: 10;
        }
        .brand {
            padding: 0 24px 24px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
            color: var(--accent); font-size: 1.1rem; display: flex; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border); margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }
        .nav-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 24px;
            color: var(--text-muted); text-decoration: none; cursor: pointer; transition: 0.2s; font-size: 14px;
        }
        .nav-item:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
        .nav-item.active { color: var(--accent); border-left: 3px solid var(--accent); background: rgba(245, 158, 11, 0.05); }

        /* --- Main Area --- */
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; z-index: 5; }
        header {
            height: 70px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px; background: rgba(11, 14, 20, 0.6); backdrop-filter: blur(10px);
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .back-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; display: none; }
        .back-btn:hover { color: var(--text-main); }
        .page-title { font-size: 20px; font-weight: 600; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        .content-scroll { flex: 1; overflow-y: auto; padding: 32px; }

        /* --- Grid & Cards --- */
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .team-card {
            background: rgba(21, 25, 34, 0.6); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 12px; padding: 24px;
            cursor: pointer; transition: 0.2s; position: relative;
        }
        .team-card:hover { border-color: var(--accent); transform: translateY(-2px); background: rgba(21, 25, 34, 0.8); }
        .team-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 16px; }
        .team-icon {
            width: 48px; height: 48px; background: rgba(255,255,255,0.05); border-radius: 8px;
            display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 24px; border: 1px solid var(--border);
        }
        .team-meta { text-align: right; font-size: 12px; color: var(--text-muted); }
        .team-name { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .team-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        .team-footer { border-top: 1px solid var(--border); padding-top: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); }

        /* --- Mission List --- */
        .mission-list { display: flex; flex-direction: column; gap: 16px; }
        .mission-card {
            background: rgba(21, 25, 34, 0.7); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 8px; display: flex; gap: 20px; padding: 20px; transition: 0.2s;
        }
        .mission-card:hover { border-color: var(--accent); background: rgba(21, 25, 34, 0.9); }
        .path-viz { width: 200px; height: 120px; background: #000; border-radius: 6px; border: 1px solid var(--border); flex-shrink: 0; position: relative; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        .mission-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .mission-top { display: flex; justify-content: space-between; }
        .mission-id { font-family: 'JetBrains Mono', monospace; color: var(--text-muted); font-size: 11px; }
        .mission-title { font-size: 16px; font-weight: 600; margin: 4px 0; }
        .mission-author { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .mission-author i { color: var(--accent); }
        .mission-stats { display: flex; gap: 16px; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
        .stat-item { display: flex; align-items: center; gap: 4px; }
        .mission-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .btn-sm:hover { background: var(--bg-hover); }
        .btn-sm.primary { border-color: var(--accent); color: var(--accent); }
        .btn-sm.primary:hover { background: rgba(245, 158, 11, 0.1); }

        /* --- Modal --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal { background: var(--bg-panel); width: 400px; padding: 24px; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .modal h3 { margin-bottom: 16px; }
        .modal-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .modal-item { padding: 10px; background: var(--bg-hover); border-radius: 4px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; }
        .modal-item:hover { background: var(--border); }
        .modal-actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <aside>
        <div class="brand"><i class="ph ph-hexagon"></i> QUANTUM</div>
        <a href="index.html" class="nav-item"><i class="ph ph-house"></i> Landing</a>
        <a href="workspace.html" class="nav-item"><i class="ph ph-squares-four"></i> My Workspace</a>
        <a href="#" class="nav-item active"><i class="ph ph-users-three"></i> Team Workspaces</a>
    </aside>

    <main>
        <header>
            <div class="header-left">
                <button class="back-btn" id="back-btn" onclick="app.showTeams()"><i class="ph ph-arrow-left"></i></button>
                <h1 class="page-title" id="page-title">Team Workspaces</h1>
            </div>
        </header>
        <div class="content-scroll">
            <div id="view-teams" class="team-grid"></div>
            <div id="view-missions" class="mission-list" style="display: none;"></div>
        </div>
    </main>

    <div class="modal-overlay" id="share-modal">
        <div class="modal">
            <h3>Share to Workspace</h3>
            <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">Select a destination workspace:</p>
            <div class="modal-list" id="modal-list"></div>
            <div class="modal-actions"><button class="btn-sm" onclick="app.closeModal()">Cancel</button></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- 3D Background: Neural Network (Connected Nodes) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 50;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Create Particles
        const particleCount = 100;
        const particles = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 100;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 60;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
            velocities.push({
                x: (Math.random() - 0.5) * 0.05,
                y: (Math.random() - 0.5) * 0.05,
                z: (Math.random() - 0.5) * 0.05
            });
        }
        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Material for dots
        const pMaterial = new THREE.PointsMaterial({ color: 0x3b82f6, size: 0.5, transparent: true, opacity: 0.4 });
        const particleSystem = new THREE.Points(particles, pMaterial);
        scene.add(particleSystem);

        // Lines geometry (will be updated every frame)
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.15 });
        const linesGeometry = new THREE.BufferGeometry();
        const lines = new THREE.LineSegments(linesGeometry, lineMaterial);
        scene.add(lines);

        // Interaction
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.05;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.05;
        });

        function animate() {
            requestAnimationFrame(animate);

            const positions = particleSystem.geometry.attributes.position.array;

            // Move particles
            for(let i=0; i<particleCount; i++) {
                positions[i*3] += velocities[i].x;
                positions[i*3+1] += velocities[i].y;
                positions[i*3+2] += velocities[i].z;

                // Bounce off "walls"
                if(Math.abs(positions[i*3]) > 50) velocities[i].x *= -1;
                if(Math.abs(positions[i*3+1]) > 30) velocities[i].y *= -1;
                if(Math.abs(positions[i*3+2]) > 25) velocities[i].z *= -1;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            // Connect lines if close
            const linePositions = [];
            const connectDistance = 15;

            for (let i = 0; i < particleCount; i++) {
                for (let j = i + 1; j < particleCount; j++) {
                    const dx = positions[i*3] - positions[j*3];
                    const dy = positions[i*3+1] - positions[j*3+1];
                    const dz = positions[i*3+2] - positions[j*3+2];
                    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

                    if (dist < connectDistance) {
                        linePositions.push(
                            positions[i*3], positions[i*3+1], positions[i*3+2],
                            positions[j*3], positions[j*3+1], positions[j*3+2]
                        );
                    }
                }
            }
            linesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));

            // Parallax
            camera.position.x += (mouseX - camera.position.x) * 0.02;
            camera.position.y += (-mouseY - camera.position.y) * 0.02;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

    <script>
        // --- Original Team App Logic (Unchanged) ---
        const teams = [
            { id: 'team-1', name: 'Search & Rescue Unit', icon: 'ph-lifebuoy', desc: 'Coordinating autonomous drone fleets for disaster relief scenarios.', members: 12, created: 'Jan 2023', creator: 'Dr. A. Vance' },
            { id: 'team-2', name: 'Engineering R&D', icon: 'ph-gear', desc: 'Testing new propulsion systems and obstacle avoidance algorithms.', members: 8, created: 'Mar 2023', creator: 'Sarah Connor' },
            { id: 'team-3', name: 'Racing League', icon: 'ph-flag-checkered', desc: 'High-speed track design and pilot training simulations.', members: 45, created: 'Jun 2023', creator: 'Maverick' }
        ];
        const missions = {
            'team-1': [{ id: 'SAR-001', title: 'Grid Search Alpha', author: 'Dr. A. Vance', date: '2h ago', status: 'Success', pathType: 'grid', stats: { time: '12m 4s', battery: '82%' } }],
            'team-2': [{ id: 'ENG-099', title: 'Wind Tunnel Test 4', author: 'Sarah Connor', date: '5h ago', status: 'Success', pathType: 'zigzag', stats: { time: '2m 00s', battery: '95%' } }],
            'team-3': [{ id: 'RACE-01', title: 'Neon Circuit Qualifier', author: 'Maverick', date: '30m ago', status: 'Success', pathType: 'loop', stats: { time: '0m 45s', battery: '100%' } }]
        };
        const myWorkspaces = ['Personal', 'Project X', 'Drafts'];
        const app = {
            state: { view: 'teams', selectedTeamId: null, selectedMissionId: null },
            init() { this.renderTeams(); },
            showTeams() {
                this.state.view = 'teams'; this.state.selectedTeamId = null;
                document.getElementById('view-teams').style.display = 'grid';
                document.getElementById('view-missions').style.display = 'none';
                document.getElementById('back-btn').style.display = 'none';
                document.getElementById('page-title').innerText = 'Team Workspaces';
            },
            selectTeam(teamId) {
                this.state.view = 'missions'; this.state.selectedTeamId = teamId;
                const team = teams.find(t => t.id === teamId);
                document.getElementById('view-teams').style.display = 'none';
                document.getElementById('view-missions').style.display = 'flex';
                document.getElementById('back-btn').style.display = 'block';
                document.getElementById('page-title').innerText = team.name;
                this.renderMissions(teamId);
            },
            renderTeams() {
                const container = document.getElementById('view-teams');
                container.innerHTML = teams.map(t => `
                    <div class="team-card" onclick="app.selectTeam('${t.id}')">
                        <div class="team-header"><div class="team-icon"><i class="ph ${t.icon}"></i></div><div class="team-meta">Est. ${t.created}</div></div>
                        <div class="team-name">${t.name}</div><div class="team-desc">${t.desc}</div>
                        <div class="team-footer"><span><i class="ph ph-users"></i> ${t.members} Members</span><span>Created by ${t.creator}</span></div>
                    </div>`).join('');
            },
            renderMissions(teamId) {
                const container = document.getElementById('view-missions'); const list = missions[teamId] || [];
                if(list.length === 0) { container.innerHTML = '<div style="padding:20px; color:var(--text-muted)">No missions.</div>'; return; }
                container.innerHTML = list.map(m => `
                    <div class="mission-card">
                        <div class="path-viz"><canvas id="canvas-${m.id}"></canvas></div>
                        <div class="mission-info">
                            <div>
                                <div class="mission-top"><span class="mission-id">${m.id}</span><span style="color:${m.status === 'Success' ? 'var(--success)' : 'var(--danger)'}; font-size:11px; font-weight:700;">${m.status.toUpperCase()}</span></div>
                                <div class="mission-title">${m.title}</div>
                                <div class="mission-author"><i class="ph ph-user"></i> ${m.author} • ${m.date}</div>
                                <div class="mission-stats"><div class="stat-item"><i class="ph ph-clock"></i> ${m.stats.time}</div><div class="stat-item"><i class="ph ph-battery-charging"></i> ${m.stats.battery}</div></div>
                            </div>
                            <div class="mission-actions">
                                <button class="btn-sm primary" onclick="app.duplicate('${m.id}')"><i class="ph ph-copy"></i> Duplicate to Personal</button>
                                <button class="btn-sm" onclick="app.share('${m.id}')"><i class="ph ph-share-network"></i> Share</button>
                            </div>
                        </div>
                    </div>`).join('');
                setTimeout(() => { list.forEach(m => this.drawPath(m.id, m.pathType, m.status === 'Success')); }, 100);
            },
            drawPath(id, type, isSuccess) {
                const canvas = document.getElementById(`canvas-${id}`); if(!canvas) return;
                const dpr = window.devicePixelRatio || 1; const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
                const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
                const w = rect.width; const h = rect.height;
                ctx.strokeStyle = '#1e2530'; ctx.lineWidth = 1; ctx.beginPath();
                for(let i=0; i<w; i+=20) { ctx.moveTo(i,0); ctx.lineTo(i,h); } for(let i=0; i<h; i+=20) { ctx.moveTo(0,i); ctx.lineTo(w,i); } ctx.stroke();
                const points = []; let x = 20, y = h/2; points.push({x,y});
                if(type === 'grid') { for(let i=0; i<4; i++) { x += 30; points.push({x, y: h/2 - 30}); x += 30; points.push({x, y: h/2 + 30}); } }
                else if (type === 'zigzag') { for(let i=0; i<6; i++) { x += 25; y = (i%2===0) ? h-20 : 20; points.push({x,y}); } }
                else { points.push({x: w/2, y: 20}); points.push({x: w-20, y: h-20}); points.push({x: 20, y: h-20}); points.push({x: w/2, y: 20}); }
                ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
                for(let i=1; i<points.length; i++) ctx.lineTo(points[i].x, points[i].y);
                ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2; ctx.strokeStyle = isSuccess ? '#10b981' : '#ef4444'; ctx.shadowBlur = 5; ctx.shadowColor = ctx.strokeStyle; ctx.stroke();
                points.forEach((p, i) => { if(i % 3 === 0) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill(); } });
            },
            duplicate(id) { alert(`Duplicating ${id} to Personal.`); },
            share(id) {
                this.state.selectedMissionId = id; const modal = document.getElementById('share-modal'); const list = document.getElementById('modal-list');
                list.innerHTML = myWorkspaces.map(ws => `<div class="modal-item" onclick="app.confirmShare('${ws}')"><span><i class="ph ph-folder"></i> ${ws}</span><i class="ph ph-arrow-right"></i></div>`).join('');
                modal.style.display = 'flex';
            },
            confirmShare(targetWs) { this.closeModal(); alert(`Shared to ${targetWs}`); },
            closeModal() { document.getElementById('share-modal').style.display = 'none'; }
        }; app.init();
    </script>
</body>
</html>
