<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfect Viewport</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1a202c 0%, #0b0e14 100%);
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      outline: none;
    }
  </style>
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0b0e14, 0.02);

    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(8, 5, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const gridHelper = new THREE.GridHelper(50, 50, 0x4a5568, 0x1a202c);
    scene.add(gridHelper);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(50, 50),
      new THREE.MeshStandardMaterial({ color: 0x0b0e14, roughness: 1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    floor.position.y = -0.01;
    scene.add(floor);

    function createDrone() {
      const group = new THREE.Group();

      const bodyGeo = new THREE.BoxGeometry(0.4, 0.1, 0.6);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2d3748 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.castShadow = true;
      group.add(body);

      const armGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.8);
      const armMat = new THREE.MeshStandardMaterial({ color: 0x718096 });

      const arm1 = new THREE.Mesh(armGeo, armMat);
      arm1.rotation.z = Math.PI / 2;
      arm1.rotation.y = Math.PI / 4;
      group.add(arm1);

      const arm2 = new THREE.Mesh(armGeo, armMat);
      arm2.rotation.z = Math.PI / 2;
      arm2.rotation.y = -Math.PI / 4;
      group.add(arm2);

      const rotorGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.01, 16);
      const rotorMat = new THREE.MeshBasicMaterial({ color: 0xd97706, transparent: true, opacity: 0.8 });
      const positions = [
        {x:0.28, z:0.28}, {x:-0.28, z:-0.28},
        {x:0.28, z:-0.28}, {x:-0.28, z:0.28}
      ];

      positions.forEach((pos) => {
        const rotor = new THREE.Mesh(rotorGeo, rotorMat);
        rotor.position.set(pos.x, 0.06, pos.z);
        group.add(rotor);
      });

      const light = new THREE.PointLight(0xe2e8f0, 1, 5);
      light.position.set(0, 0.2, 0);
      group.add(light);

      return group;
    }

    const drone = createDrone();
    drone.position.set(0, 0.4, 0);
    scene.add(drone);

    const pathMaterial = new THREE.LineDashedMaterial({
      color: 0x4a5568,
      dashSize: 0.5,
      gapSize: 0.2,
      opacity: 0.5,
      transparent: true
    });
    const points = [
      new THREE.Vector3(0, 0.4, 0),
      new THREE.Vector3(0, 1.5, 0),
      new THREE.Vector3(0, 1.5, -2),
      new THREE.Vector3(2, 1.5, -3),
      new THREE.Vector3(2, 0.6, -4)
    ];
    const path = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), pathMaterial);
    path.computeLineDistances();
    scene.add(path);

    function onResize() {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    window.addEventListener('resize', onResize);

    function animate() {
      requestAnimationFrame(animate);
      drone.rotation.y += 0.01;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
