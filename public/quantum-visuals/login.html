<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Quantum Control</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Three.js -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>

    <style>
        :root {
            --bg-dark: #050505;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.5);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --glass: rgba(20, 20, 25, 0.6);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- 3D Background --- */
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* --- Login Card --- */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            opacity: 0; /* Hidden initially for GSAP */
            transform: translateY(30px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            color: var(--text-main);
            text-decoration: none;
        }
        .brand svg { width: 32px; height: 32px; color: var(--accent); }
        .brand span {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.02em;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        /* --- Form Elements --- */
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            pointer-events: none;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 12px 12px 40px; /* space for icon */
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .password-toggle:hover { color: var(--text-main); }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-primary:active { transform: translateY(0); }

        /* --- Footer Links --- */
        .footer-links {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: var(--accent); }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .login-card { padding: 24px; }
            h1 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <!-- 3D Background -->
    <div id="canvas-container"></div>

    <!-- Login Form -->
    <div class="login-wrapper">
        <div class="login-card" id="login-card">
            
            <a href="index.html" class="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/>
                </svg>
                <span>QUANTUM CONTROL</span>
            </a>

            <h1>Welcome back</h1>
            <p class="subtitle">Enter your credentials to access the flight deck.</p>

            <form onsubmit="event.preventDefault(); handleLogin();">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <i class="ph ph-envelope-simple input-icon"></i>
                        <input type="email" placeholder="pilot@quantum.control" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <i class="ph ph-lock-key input-icon"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="ph ph-eye password-toggle" onclick="togglePassword()"></i>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <div class="footer-links">
                <a href="#">Create Account</a>
                <a href="#">Forgot Password?</a>
            </div>
        </div>
    </div>

    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script type="module">
        import * as THREE from 'three';

        // --- Three.js Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // Fog to fade particles into the dark background
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- Objects ---

        // 1. The Core (Wireframe Torus Knot)
        const geometry = new THREE.TorusKnotGeometry(1.5, 0.4, 150, 20);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0xf59e0b, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.15 
        });
        const torusKnot = new THREE.Mesh(geometry, material);
        scene.add(torusKnot);

        // 2. The Particle Field (Starfield/Data dust)
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            // Spread particles in a wide area
            posArray[i] = (Math.random() - 0.5) * 20; 
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.03,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // --- Interaction ---
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Rotate Core
            torusKnot.rotation.x = elapsedTime * 0.1;
            torusKnot.rotation.y = elapsedTime * 0.15;

            // Animate Particles (Wave effect)
            particlesMesh.rotation.y = -elapsedTime * 0.05;
            
            // Mouse Parallax (Smooth easing)
            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;

            torusKnot.rotation.y += 0.05 * (targetX - torusKnot.rotation.y);
            torusKnot.rotation.x += 0.05 * (targetY - torusKnot.rotation.x);
            
            // Move particles slightly opposite to mouse for depth
            particlesMesh.position.x += 0.05 * (targetX * 2 - particlesMesh.position.x);
            particlesMesh.position.y += 0.05 * (-targetY * 2 - particlesMesh.position.y);

            renderer.render(scene, camera);
        }

        animate();

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- GSAP Animations ---
        gsap.to("#login-card", {
            duration: 1.2,
            y: 0,
            opacity: 1,
            ease: "power3.out",
            delay: 0.2
        });
    </script>

    <script>
        // --- UI Logic ---
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.password-toggle');
            
            if(input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('ph-eye', 'ph-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('ph-eye-slash', 'ph-eye');
            }
        }

        function handleLogin() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;
            
            btn.innerText = "Authenticating...";
            btn.style.opacity = "0.7";
            
            // Simulate API call
            setTimeout(() => {
                btn.innerText = "Access Granted";
                btn.style.background = "#10b981"; // Green
                btn.style.color = "#fff";
                
                setTimeout(() => {
                    window.location.href = "workspace.html"; // Redirect
                }, 800);
            }, 1500);
        }
    </script>
</body>
</html>
